<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Huntman</title>
    <style>
      body { margin: 0; overflow: hidden; background: #000; touch-action: none; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="welcome-screen" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000;">
      <h1 style="font-size: 48px; margin-bottom: 20px;">HUNTMAN</h1>
      <p style="margin-bottom: 40px;">The Ultimate Mobile FPS</p>
      <button id="start-btn" style="padding: 15px 40px; font-size: 24px; background: red; color: white; border: none; cursor: pointer; border-radius: 5px;">START GAME</button>
      <p style="margin-top: 20px; font-size: 14px; opacity: 0.7;">Optimized for older devices & tablets</p>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      document.getElementById('start-btn').onclick = () => {
        document.getElementById('welcome-screen').style.display = 'none';
      };
    </script>
  </body>
</html>
