<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Huntman</title>
    <style>
      body { margin: 0; overflow: hidden; background: #000; touch-action: none; user-select: none; -webkit-user-select: none; }
      canvas { display: block; }
      
      #ui-root {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 100;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      #main-menu {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle, #111 0%, #000 100%);
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }

      .menu-title { font-size: 64px; font-weight: 900; letter-spacing: 5px; color: red; text-shadow: 0 0 20px rgba(255,0,0,0.5); margin-bottom: 50px; }
      
      .menu-btn {
        width: 250px;
        padding: 15px;
        margin: 10px;
        font-size: 18px;
        font-weight: bold;
        background: rgba(255,255,255,0.1);
        color: white;
        border: 2px solid white;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.2s;
        text-align: center;
      }

      .menu-btn:active { background: white; color: black; transform: scale(0.95); }
      .menu-btn.premium { border-color: yellow; color: yellow; }

      .joystick-zone {
        position: absolute;
        bottom: 5%;
        width: 45%;
        height: 40%;
        pointer-events: auto;
        touch-action: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #zone-move { left: 2%; }
      #zone-look { right: 2%; }

      .joystick-base {
        width: 120px;
        height: 120px;
        background: rgba(255,255,255,0.1);
        border: 2px solid rgba(255,255,255,0.3);
        border-radius: 50%;
        position: relative;
        display: none;
      }

      .joystick-knob {
        width: 60px;
        height: 60px;
        background: rgba(255,255,255,0.8);
        border-radius: 50%;
        position: absolute;
        top: 30px;
        left: 30px;
      }

      .btn {
        position: absolute;
        width: 70px;
        height: 70px;
        border-radius: 50%;
        color: white;
        font-weight: bold;
        border: 2px solid white;
        pointer-events: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 110;
      }

      #btn-fire { bottom: 35%; right: 10%; background: rgba(255,0,0,0.6); }
      #btn-aim { bottom: 55%; right: 10%; background: rgba(255,165,0,0.6); border-color: orange; }
      #btn-jump { bottom: 35%; left: 10%; background: rgba(0,255,255,0.4); border-color: cyan; }

      #debug-log {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        color: #0f0;
        background: rgba(0,0,0,0.7);
        padding: 5px;
        font-size: 12px;
        z-index: 200;
        display: none; /* Hide debug by default now */
      }
    </style>
  </head>
  <body>
    <div id="main-menu">
      <h1 class="menu-title">HUNTMAN</h1>
      <button class="menu-btn" onclick="window.startGame('practice')">PRACTICE MODE</button>
      <button class="menu-btn" onclick="window.startGame('multiplayer')">PUBLIC MATCH</button>
      <button class="menu-btn premium" onclick="window.startGame('friend')">1V1 WITH FRIEND</button>
      <p style="margin-top: 30px; opacity: 0.5;">v2.5 - Stable Build</p>
    </div>

    <div id="ui-root" style="display: none;">
      <div id="debug-log">Debug: Ready</div>
      
      <div id="zone-move" class="joystick-zone">
        <div id="base-move" class="joystick-base"><div id="knob-move" class="joystick-knob"></div></div>
      </div>
      
      <div id="zone-look" class="joystick-zone">
        <div id="base-look" class="joystick-base"><div id="knob-look" class="joystick-knob"></div></div>
      </div>

      <div id="btn-fire" class="btn">FIRE</div>
      <div id="btn-aim" class="btn">AIM</div>
      <div id="btn-jump" class="btn">JUMP</div>
      
      <div id="currency-display" style="position: absolute; top: 20px; right: 20px; color: yellow; font-size: 20px; font-weight: bold; text-shadow: 2px 2px #000;">HuntCoins: 0</div>
      
      <!-- Permanent Plus Crosshair -->
      <div id="crosshair-plus" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 50;">
        <div style="position: absolute; top: 50%; left: 50%; width: 20px; height: 2px; background: white; transform: translate(-50%, -50%);"></div>
        <div style="position: absolute; top: 50%; left: 50%; width: 2px; height: 20px; background: white; transform: translate(-50%, -50%);"></div>
      </div>

      <button onclick="location.reload()" style="position: absolute; top: 20px; left: 20px; padding: 10px; background: rgba(0,0,0,0.5); color: white; border: 1px solid white; pointer-events: auto;">MENU</button>
    </div>

    <div id="app"></div>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
