<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Huntman</title>
    <style>
      body { margin: 0; overflow: hidden; background: #000; touch-action: none; user-select: none; -webkit-user-select: none; }
      canvas { display: block; }
      
      #ui-root {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 100;
        font-family: Arial, sans-serif;
      }

      .joystick-zone {
        position: absolute;
        bottom: 5%;
        width: 45%;
        height: 40%;
        pointer-events: auto;
        touch-action: none;
        border: 1px dashed rgba(255,255,255,0.1);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #zone-move { left: 2%; }
      #zone-look { right: 2%; }

      .joystick-base {
        width: 120px;
        height: 120px;
        background: rgba(255,255,255,0.1);
        border: 2px solid rgba(255,255,255,0.3);
        border-radius: 50%;
        position: relative;
        display: none; /* Shown on touch */
      }

      .joystick-knob {
        width: 60px;
        height: 60px;
        background: rgba(255,255,255,0.8);
        border-radius: 50%;
        position: absolute;
        top: 30px;
        left: 30px;
      }

      .btn {
        position: absolute;
        width: 70px;
        height: 70px;
        border-radius: 50%;
        color: white;
        font-weight: bold;
        border: 2px solid white;
        pointer-events: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 110;
      }

      #btn-fire { bottom: 50%; right: 10%; background: rgba(255,0,0,0.6); }
      #btn-jump { bottom: 50%; left: 10%; background: rgba(0,255,255,0.4); }

      #debug-log {
        position: absolute;
        top: 50px;
        left: 50%;
        transform: translateX(-50%);
        color: #0f0;
        background: rgba(0,0,0,0.7);
        padding: 5px;
        font-size: 12px;
        z-index: 200;
      }
    </style>
  </head>
  <body>
    <div id="welcome-screen" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000;">
      <h1 style="font-size: 48px; margin-bottom: 20px;">HUNTMAN</h1>
      <button id="start-btn" style="padding: 15px 40px; font-size: 24px; background: red; color: white; border: none; cursor: pointer; border-radius: 5px;">START GAME</button>
    </div>

    <div id="ui-root">
      <div id="debug-log">Debug: Waiting for touch...</div>
      
      <div id="zone-move" class="joystick-zone">
        <div id="base-move" class="joystick-base"><div id="knob-move" class="joystick-knob"></div></div>
      </div>
      
      <div id="zone-look" class="joystick-zone">
        <div id="base-look" class="joystick-base"><div id="knob-look" class="joystick-knob"></div></div>
      </div>

      <div id="btn-fire" class="btn">FIRE</div>
      <div id="btn-aim" class="btn" style="bottom: 65%; right: 10%; background: rgba(255,165,0,0.6); border-color: orange;">AIM</div>
      <div id="btn-jump" class="btn">JUMP</div>
      
      <div id="currency-display" style="position: absolute; top: 20px; right: 20px; color: yellow; font-size: 20px; font-weight: bold; text-shadow: 2px 2px #000;">HuntCoins: 0</div>
    </div>

    <div id="app"></div>
    
    <script type="module" src="/src/main.ts"></script>
    <script>
      document.getElementById('start-btn').onclick = () => {
        document.getElementById('welcome-screen').style.display = 'none';
      };
    </script>
  </body>
</html>
